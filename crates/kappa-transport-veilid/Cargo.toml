[package]
name = "kappa-transport-veilid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Veilid P2P transport for kappa-registry: node lifecycle, DHT persistence, gossip mesh, bulk transfer, and MST reconciliation."

[lib]
name = "kappa_transport_veilid"
path = "src/v1/lib.rs"

[dependencies]
kappa-types = { workspace = true }
kappa-store = { workspace = true }
kappa-reconcile = { workspace = true }

# Commodity transport. This crate consumes the Transport trait and
# re-exported types directly. No veilid_core types cross this boundary.
rekindle-transport-veilid = { git = "https://github.com/ScopeCreep-zip/rekindle", branch = "feat/cli-tui-restructure-rewrite" }
rekindle-types = { git = "https://github.com/ScopeCreep-zip/rekindle", branch = "feat/cli-tui-restructure-rewrite" }

tokio = { workspace = true }
tracing = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
merkle-search-tree = { workspace = true }

[dev-dependencies]
kappa-crypto = { workspace = true, features = ["test-util"] }
kappa-handler = { workspace = true, features = ["test-util"] }
kappa-store-memory = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
