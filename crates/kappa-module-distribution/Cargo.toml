[package]
name = "kappa-module-distribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Kappa-distribution protocol extension handlers."

[lib]
name = "kappa_module_distribution"
path = "src/v1/lib.rs"

[dependencies]
kappa-core = { workspace = true }
kappa-types = { workspace = true }
kappa-crypto = { workspace = true }
kappa-store = { workspace = true }
kappa-handler = { workspace = true }
kappa-reconcile = { workspace = true }
topcoat = { workspace = true, features = ["sse"] }
futures-util = "0.3"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
bytes = "1"

[dev-dependencies]
kappa-crypto = { workspace = true, features = ["test-util"] }
kappa-handler = { workspace = true, features = ["test-util"] }
kappa-fixture = { workspace = true }
kappa-store-memory = { workspace = true, features = ["test-util"] }
kappa-store-redb = { workspace = true }
