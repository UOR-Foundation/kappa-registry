[package]
name = "kappa-module-nix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Nix binary cache protocol module for kappa-registry."

[lib]
name = "kappa_module_nix"
path = "src/v1/lib.rs"

[dependencies]
kappa-store = { workspace = true }
kappa-handler = { workspace = true }
kappa-types = { workspace = true }
kappa-crypto = { workspace = true }
bytes = "1"
nix-derivation = { git = "https://github.com/cachix/nix-derivation" }
thiserror = { workspace = true }
base64 = "0.23"
zstd = "0.14"
xz2 = "0.1"
bzip2 = "0.6"
sha2 = { workspace = true }
topcoat = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
kappa-crypto = { workspace = true, features = ["test-util"] }
kappa-handler = { workspace = true, features = ["test-util"] }
kappa-store-memory = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
