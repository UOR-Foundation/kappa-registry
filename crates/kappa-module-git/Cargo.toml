[package]
name = "kappa-module-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Git smart HTTP protocol module for kappa-registry."

[lib]
name = "kappa_module_git"
path = "src/v1/lib.rs"

[dependencies]
kappa-core = { workspace = true }
kappa-types = { workspace = true }
kappa-store = { workspace = true }
kappa-handler = { workspace = true }
topcoat = { workspace = true }

gix-object = "0.65"
gix-pack = { version = "0.75", features = ["streaming-input", "generate"] }
gix-hash = { version = "0.27", features = ["sha1", "sha256"] }
gix-features = { version = "0.50", features = ["progress"] }
gix-packetline = { version = "0.23", features = ["blocking-io"] }
# The error contract of the gix crates above: `Find::try_find_cached`
# returns `ExnResult`, packet-line decoding `ExnMessageResult`.
gix-error = "0.4"
flate2 = "1"

hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
kappa-crypto = { workspace = true, features = ["test-util"] }
kappa-handler = { workspace = true, features = ["test-util"] }
kappa-store-memory = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
