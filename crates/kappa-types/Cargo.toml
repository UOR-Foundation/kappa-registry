[package]
name = "kappa-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Content-addressed types for kappa-registry: Kappa, Axis, VerifiedContent, ClockMs, NamespaceRef, Edge, Tag, Epoch, Identity types, canonical dCBOR, Merkle roots. Zero IO, zero async, zero HTTP. Every SDK on every platform depends on this crate."

[lib]
name = "kappa_types"
path = "src/v1/lib.rs"

[dependencies]
dcbor = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
blake3 = { workspace = true }
sha1-checked = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true }
chrono = { workspace = true }

# SHA-256 through aws-lc's runtime-dispatched assembly where it builds;
# other targets hash with RustCrypto sha2 (see src/v1/sha256.rs).
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
aws-lc-rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
test-util = []

[lints]
workspace = true
