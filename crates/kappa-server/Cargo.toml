[package]
name = "kappa-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "kappa-registry HTTP server."

[[bin]]
name = "kappa-server"
path = "src/main.rs"

[dependencies]
kappa-core = { workspace = true }
topcoat = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
governor = { workspace = true }
http = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

dashmap = { workspace = true }
kappa-store-redb = { path = "../kappa-store-redb" }
uuid = { workspace = true }
libc = "0.2"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"

kappa-akd = { path = "../kappa-akd" }
kappa-module-oci = { path = "../kappa-module-oci", optional = true }
kappa-module-identity = { path = "../kappa-module-identity", optional = true }
kappa-module-distribution = { path = "../kappa-module-distribution", optional = true }
kappa-transport-veilid = { path = "../kappa-transport-veilid", optional = true }

[dev-dependencies]
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
blake3 = { workspace = true }
sha3 = { workspace = true }
rcgen = "0.14"
tungstenite = "0.30"
libc = "0.2"
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
getrandom = { workspace = true }
kappa-core = { workspace = true }

[[test]]
name = "smoke"
path = "tests/integration/smoke.rs"

[[test]]
name = "operational"
path = "tests/integration/operational.rs"

[[test]]
name = "persistence"
path = "tests/integration/persistence.rs"

[[test]]
name = "streaming"
path = "tests/integration/streaming.rs"

[[test]]
name = "auth"
path = "tests/integration/auth.rs"

[[test]]
name = "federation"
path = "tests/integration/federation.rs"

[[test]]
name = "disk_pressure"
path = "tests/integration/disk_pressure.rs"

[[test]]
name = "tls"
path = "tests/integration/tls.rs"

[[test]]
name = "akd"
path = "tests/integration/akd.rs"

[[test]]
name = "oci_protocol"
path = "tests/integration/oci_protocol.rs"

[[test]]
name = "lifecycle"
path = "tests/integration/lifecycle.rs"

[[test]]
name = "security"
path = "tests/integration/security.rs"

[[test]]
name = "correctness"
path = "tests/integration/correctness.rs"

[[test]]
name = "websocket"
path = "tests/integration/websocket.rs"

[features]
default = ["oci", "identity-http", "distribution"]
oci = ["dep:kappa-module-oci"]
identity-http = ["dep:kappa-module-identity"]
distribution = ["dep:kappa-module-distribution"]
veilid = ["dep:kappa-transport-veilid"]
