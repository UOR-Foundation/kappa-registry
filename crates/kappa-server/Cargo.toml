[package]
name = "kappa-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "kappa-registry HTTP server."

[lib]
name = "kappa_server"
path = "src/v1/lib.rs"

[[bin]]
name = "kappa-server"
path = "src/v1/main.rs"

[dependencies]
kappa-core = { workspace = true }
kappa-store = { workspace = true }
kappa-crypto = { workspace = true }
kappa-handler = { workspace = true }
topcoat = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
governor = { workspace = true }
http = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
# Scalar API reference: the embedded standalone bundle served at
# /docs/scalar.js; the /docs page itself is written by src/v1/docs.rs.
# Bundles @scalar/api-reference 1.73.0.
scalar_api_reference = { version = "0.2.12", default-features = false }

async-trait = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
md-5 = "0.11"
base64-simd = "0.8"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
http-body = "1"
bytes = "1"
zeroize = { workspace = true }
kappa-store-redb = { path = "../kappa-store-redb" }
uuid = { workspace = true }
libc = "0.2"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
hickory-resolver = { version = "0.26", features = ["tokio"] }
bs58 = { workspace = true }
unsigned-varint = { workspace = true }
x509-parser = { version = "0.18", optional = true }

kappa-transparency = { workspace = true }
kappa-module-oci = { path = "../kappa-module-oci", optional = true }
kappa-module-identity = { path = "../kappa-module-identity", optional = true }
kappa-module-distribution = { path = "../kappa-module-distribution", optional = true }
kappa-transport-veilid = { path = "../kappa-transport-veilid", optional = true }
postcard = { workspace = true, optional = true }
kappa-module-git = { path = "../kappa-module-git", optional = true }
kappa-module-s3 = { path = "../kappa-module-s3", optional = true }
kappa-module-nix = { path = "../kappa-module-nix", optional = true }
kappa-module-atproto = { path = "../kappa-module-atproto", optional = true }
gix-hash = { version = "0.27", features = ["sha1"], optional = true }

[dev-dependencies]
cucumber = "0.23"
reqwest = { version = "0.13", features = ["blocking", "json", "query", "rustls"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
blake3 = { workspace = true }
sha3 = { workspace = true }
rcgen = "0.14"
tungstenite = "0.30"
libc = "0.2"
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
getrandom = { workspace = true }
kappa-fixture = { workspace = true }
kappa-store-redb = { path = "../kappa-store-redb", features = ["test-util"] }
kappa-crypto = { workspace = true, features = ["test-util"] }
kappa-handler = { workspace = true, features = ["test-util"] }
kappa-transparency = { workspace = true }
zstd = "0.14"
nix-derivation = { git = "https://github.com/cachix/nix-derivation" }

[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "bdd"
path = "../../tests/bdd.rs"
harness = false

[features]
default = ["oci", "identity-http", "distribution", "git", "s3", "nix"]
oci = ["dep:kappa-module-oci"]
identity-http = ["dep:kappa-module-identity"]
distribution = ["dep:kappa-module-distribution"]
veilid = ["dep:kappa-transport-veilid", "dep:postcard"]
git = ["dep:kappa-module-git", "dep:gix-hash"]
s3 = ["dep:kappa-module-s3"]
nix = ["dep:kappa-module-nix"]
atproto = ["dep:kappa-module-atproto", "dep:x509-parser"]
