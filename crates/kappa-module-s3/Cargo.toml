[package]
name = "kappa-module-s3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "S3-compatible protocol module for kappa-registry."

[lib]
name = "kappa_module_s3"
path = "src/v1/lib.rs"

[dependencies]
kappa-core = { workspace = true }
kappa-store = { workspace = true }
kappa-handler = { workspace = true }
kappa-types = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
topcoat = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
md-5 = "0.11"
crc-fast = "1"
bytes = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
base64-simd = "0.8"

thiserror = { workspace = true }

[dev-dependencies]
kappa-crypto = { workspace = true, features = ["test-util"] }
kappa-handler = { workspace = true, features = ["test-util"] }
kappa-store-memory = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
